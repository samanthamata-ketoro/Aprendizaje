<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="container">

        <header class="header">
            <h1 class="title">My Tasks</h1>
            <p class="subtitle">Organiza tu día con estilo</p>
        </header>

        <div class="input-section">
            <input 
                type="text" 
                id="task-input" 
                placeholder="¿Qué necesitas hacer hoy?" 
                autocomplete="off"
            />
            <button id="add-task-button">
                <span class="btn-icon">+</span>
                <span class="btn-text">Agregar</span>
            </button>
        </div>

        <div class="stats-bar">
            <span id="stats-text">0 tareas pendientes</span>
            <button id="clear-completed" class="clear-btn">Limpiar completadas</button>
        </div>

        <ul id="task-list"></ul>

        <div class="empty-state" id="empty-state">
            <div class="empty-icon">✦</div>
            <p>Tu lista está vacía.<br>¡Agrega tu primera tarea!</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
